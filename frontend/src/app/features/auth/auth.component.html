<div class="auth-container min-h-screen flex items-center justify-center bg-[#fdfaf6] dark:bg-dark-surface p-4 relative overflow-hidden">
  
  <!-- Decorative background elements -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-amber-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 translate-x-1/3 -translate-y-1/3"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 -translate-x-1/3 translate-y-1/3"></div>
  <div class="absolute top-1/2 left-1/2 w-72 h-72 bg-yellow-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 -translate-x-1/2 -translate-y-1/2"></div>

  <div class="auth-card w-full max-w-md bg-white/80 backdrop-blur-sm rounded-3xl shadow-xl border border-amber-100/50 p-8 sm:p-10 relative z-10">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white dark:bg-dark-surface p-2.5 mb-6 shadow-lg border border-amber-100/50">
        <img src="/LOGO_without_bg.png" alt="Lifinity Logo" class="w-full h-full object-contain">
      </div>
      <h1 class="text-3xl font-bold text-amber-950 mb-2 tracking-tight">Lifinity</h1>
      <p class="text-amber-700/80">{{ isLoginMode ? 'Welcome back, explorer' : 'Start your journey' }}</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="mb-6 p-4 rounded-2xl bg-red-50 border border-red-100 flex items-start gap-3 slide-down">
      <span class="material-symbols-rounded text-red-500 text-xl font-medium shrink-0">error</span>
      <p class="text-red-800 text-sm mt-0.5 leading-relaxed">{{ error }}</p>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- Name Field (Register Mode Only) -->
      <div *ngIf="!isLoginMode" class="form-group slide-down">
        <label for="name" class="block text-sm font-medium text-amber-900 mb-1.5 ml-1">Full Name</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-600/50 group-focus-within:text-amber-500 transition-colors">
            <span class="material-symbols-rounded text-[20px]">person</span>
          </div>
          <input 
            type="text" 
            id="name" 
            formControlName="name" 
            class="block w-full pl-10 pr-4 py-3 bg-amber-50/50 border border-amber-200/60 rounded-2xl text-amber-950 placeholder-amber-900/30 focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all duration-200 sm:text-sm"
            placeholder="John Doe"
          >
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="block text-sm font-medium text-amber-900 mb-1.5 ml-1">Email Address</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-600/50 group-focus-within:text-amber-500 transition-colors">
            <span class="material-symbols-rounded text-[20px]">mail</span>
          </div>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            class="block w-full pl-10 pr-4 py-3 bg-amber-50/50 border border-amber-200/60 rounded-2xl text-amber-950 placeholder-amber-900/30 focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all duration-200 sm:text-sm"
            placeholder="you@example.com"
          >
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="block text-sm font-medium text-amber-900 mb-1.5 ml-1">Password</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-600/50 group-focus-within:text-amber-500 transition-colors">
            <span class="material-symbols-rounded text-[20px]">lock</span>
          </div>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            class="block w-full pl-10 pr-11 py-3 bg-amber-50/50 border border-amber-200/60 rounded-2xl text-amber-950 placeholder-amber-900/30 focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all duration-200 sm:text-sm"
            placeholder="••••••••"
          >
          <button 
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-amber-600/40 hover:text-amber-600 transition-colors"
          >
            <span class="material-symbols-rounded text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field (Register Mode Only) -->
      <div *ngIf="!isLoginMode" class="form-group slide-down">
        <label for="confirmPassword" class="block text-sm font-medium text-amber-900 mb-1.5 ml-1">Confirm Password</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-600/50 group-focus-within:text-amber-500 transition-colors">
            <span class="material-symbols-rounded text-[20px]">lock_reset</span>
          </div>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            class="block w-full pl-10 pr-11 py-3 bg-amber-50/50 border border-amber-200/60 rounded-2xl text-amber-950 placeholder-amber-900/30 focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all duration-200 sm:text-sm"
            [ngClass]="{'border-red-400 focus:border-red-500 focus:ring-red-500/20': passwordMismatch}"
            placeholder="••••••••"
          >
          <button 
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-amber-600/40 hover:text-amber-600 transition-colors"
          >
            <span class="material-symbols-rounded text-[20px]">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <p *ngIf="passwordMismatch" class="text-red-500 text-xs mt-1.5 ml-1 flex items-center gap-1">
          <span class="material-symbols-rounded text-[14px]">error</span>
          Passwords do not match
        </p>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="authForm.invalid || isLoading || (!isLoginMode && passwordMismatch)"
        class="w-full flex justify-center items-center gap-2 py-3.5 px-4 mt-8 border border-transparent rounded-2xl shadow-sm text-sm font-medium text-white bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98]"
      >
        <span *ngIf="isLoading" class="material-symbols-rounded animate-spin text-[20px]">refresh</span>
        {{ isLoading ? 'Processing...' : (isLoginMode ? 'Sign In' : 'Create Account') }}
      </button>
    </form>

    <!-- Divider -->
    <div class="mt-8 mb-6 relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-amber-900/10"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-3 bg-white/80 text-amber-900/50">or</span>
      </div>
    </div>

    <!-- Google Sign In Button -->
    <div class="google-btn-wrapper flex justify-center">
      <div id="google-signin-btn" class="w-full"></div>
      <!-- Fallback button when Google SDK isn't configured -->
      <button 
        *ngIf="!googleAvailable"
        type="button"
        disabled
        class="w-full flex justify-center items-center gap-3 py-3 px-4 border border-amber-200/60 rounded-2xl bg-white hover:bg-amber-50/50 text-amber-900 text-sm font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google Sign-In (Not configured)
      </button>
    </div>

    <!-- Toggle Mode -->
    <div class="text-center mt-6">
      <button 
        (click)="toggleMode()" 
        type="button" 
        class="text-sm font-medium text-amber-600 hover:text-amber-800 transition-colors"
      >
        {{ isLoginMode ? "Don't have an account? Sign up" : 'Already have an account? Sign in' }}
      </button>
    </div>

  </div>
</div>
